<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesh Network Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Ccircle cx='12' cy='12' r='3'/%3E%3C/svg%3E">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="2"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/>
          <circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/>
          <path d="M7 7l3.5 3.5M17 7l-3.5 3.5M7 17l3.5-3.5M17 17l-3.5-3.5"/>
        </svg>
      </span>
      <div>
        <h1>Mesh Network Dashboard</h1>
        <p>Real-time indoor positioning &amp; telemetry</p>
      </div>
    </div>

    <div class="header-right">
      <span class="conn"><span id="conn-dot" class="dot dot-grey"></span><span id="conn-text">connecting…</span></span>
      <span class="clock" id="clock">--:--:--</span>
      <button class="theme-toggle" id="theme-toggle" title="Toggle light/dark" aria-label="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- KPI summary row -->
    <section class="kpis">
      <div class="kpi">
        <span class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg></span>
        <div><div class="kpi-val" id="kpi-total">—</div><div class="kpi-label">Total nodes</div></div>
      </div>
      <div class="kpi">
        <span class="kpi-icon" style="color:var(--online);background:color-mix(in srgb,var(--online) 14%,transparent)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span>
        <div><div class="kpi-val" id="kpi-online">—</div><div class="kpi-label">Online now</div></div>
      </div>
      <div class="kpi">
        <span class="kpi-icon" style="color:var(--anchor);background:color-mix(in srgb,var(--anchor) 14%,transparent)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V8M5 12a7 7 0 0 0 14 0M12 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM5 12H3m18 0h-2"/></svg></span>
        <div><div class="kpi-val" id="kpi-anchors">—</div><div class="kpi-label">Anchors</div></div>
      </div>
      <div class="kpi">
        <span class="kpi-icon" style="color:var(--node);background:color-mix(in srgb,var(--node) 14%,transparent)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.2-7-11a7 7 0 0 1 14 0c0 5.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
        <div><div class="kpi-val" id="kpi-mobile">—</div><div class="kpi-label">Mobile nodes</div></div>
      </div>
    </section>

    <div class="grid">
      <!-- Position map -->
      <section class="panel panel-map">
        <div class="panel-head">
          <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/></svg>Live Position Map</h2>
          <label class="toggle"><input type="checkbox" id="trails-toggle" checked> Trails</label>
        </div>
        <canvas id="map"></canvas>
      </section>

      <!-- Network health -->
      <section class="panel panel-health">
        <div class="panel-head"><h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg>Network Health</h2></div>
        <table>
          <thead><tr><th></th><th>Node</th><th>Role</th><th>Last seen</th><th>Peers</th></tr></thead>
          <tbody id="health-body"></tbody>
        </table>
      </section>

      <!-- Sensor cards -->
      <section class="panel panel-cards">
        <div class="panel-head"><h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Per-Node Sensors</h2></div>
        <div id="cards" class="cards"></div>
      </section>

      <!-- Historical trend -->
      <section class="panel panel-trend">
        <div class="panel-head">
          <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>Historical Trend</h2>
          <div class="controls">
            <label class="toggle"><input type="checkbox" id="trend-smooth" checked> Smooth</label>
            <select id="trend-field">
              <option value="altitude">Altitude (m)</option>
              <option value="pressure">Pressure (Pa)</option>
              <option value="temp">Temperature (°C)</option>
              <option value="azimuth">Heading (°)</option>
            </select>
            <select id="trend-window">
              <option value="10">10 min</option>
              <option value="30" selected>30 min</option>
              <option value="60">60 min</option>
            </select>
          </div>
        </div>
        <div class="chart-wrap"><canvas id="trend"></canvas></div>
      </section>
    </div>
  </main>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
